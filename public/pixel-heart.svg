  <title>Pixel heart</title>
  <defs>
    <!-- Palette: neon cyan / pink / purple (same hex as globals.css :root) -->
    <linearGradient id="pixelHeartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3be8ff"/>
      <stop offset="48%" stop-color="#ff4fd8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="pixelHeartGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.4" result="glowWide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.35" result="glowTight"/>
      <feMerge>
        <feMergeNode in="glowWide"/>
        <feMergeNode in="glowTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#pixelHeartGlow)">
